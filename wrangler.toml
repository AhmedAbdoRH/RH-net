# ===========================================
# Cloudflare Workers — OpenNext deployment
# يُبنى عبر: npm run cf:build
# ===========================================

name = "rh-net"
main = ".open-next/worker.js"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]

# الأصول الثابتة المبنية بواسطة OpenNext
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ===========================================
# Durable Objects — مطلوبة لـ ISR / الكاش / revalidation
# بدونهن الـ Worker بيرجع 500 على كل الصفحات
# ===========================================
[[durable_objects.bindings]]
name = "NEXT_CACHE_DO_QUEUE"
class_name = "DOQueueHandler"

[[durable_objects.bindings]]
name = "NEXT_TAG_CACHE_DO_SHARDED"
class_name = "DOShardedTagCache"

[[durable_objects.bindings]]
name = "NEXT_CACHE_DO_PURGE"
class_name = "BucketCachePurge"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler", "DOShardedTagCache", "BucketCachePurge"]

